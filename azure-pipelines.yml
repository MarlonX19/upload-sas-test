# ============================================================================
# Azure DevOps — build da imagem Docker (Next.js standalone).
#
# Segredos (AUTH_SECRET, MONGODB_URI, GENAI_KEY, …): Variable groups marcadas como
# "secret" OU Application settings onde o contentor corre — não em build-args.
#
# NEXT_PUBLIC_APP_URL — pipeline variable (valor público típico: URL HTTPS da app).
# ============================================================================
#
# Docs Docker task: https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
  - feat/analises-pds

resources:
  - repo: self

variables:
  imageRepository: upload-sas-test

stages:
  - stage: Build
    displayName: Build imagem Docker
    jobs:
      - job: DockerJob
        displayName: Docker
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            fetchDepth: 1

          - script: |
              set -eu
              docker build \
                --build-arg NEXT_PUBLIC_APP_URL="$(NEXT_PUBLIC_APP_URL)" \
                -t "$(imageRepository):$(Build.BuildId)" \
                -t "$(imageRepository):latest" \
                -f "$(Build.SourcesDirectory)/Dockerfile" \
                "$(Build.SourcesDirectory)"
            displayName: docker build

          # Opcional: após criar service connection ao ACR — docker login + docker push ...
