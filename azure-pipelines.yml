# ============================================================================
# Azure DevOps Pipeline
# Build + Push da imagem Docker para Azure Container Registry (ACR)
#
# Registry:
#   uploadsastest.azurecr.io
#
# Service Connection:
#   uploadsastest-acr
#
# Imagem final:
#   uploadsastest.azurecr.io/upload-sas-test:dev
#   uploadsastest.azurecr.io/upload-sas-test:latest
#
# Secrets:
#   NÃO colocar secrets em build-args.
#   Use Variable Groups secretos ou App Settings no App Service.
#
# ============================================================================

trigger:
  - feat/analises-pds

resources:
  - repo: self

variables:
  imageRepository: 'upload-sas-test'
  containerRegistry: 'uploadsastest-acr'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  buildContext: '$(Build.SourcesDirectory)'

stages:
  - stage: BuildAndPush
    displayName: Build and Push Docker image

    jobs:
      - job: DockerJob
        displayName: Docker Build + Push

        pool:
          vmImage: ubuntu-latest

        steps:
          - checkout: self
            fetchDepth: 1

          - task: Docker@2
            displayName: Build and Push image to ACR

            inputs:
              command: buildAndPush

              # Nome da imagem no registry
              repository: $(imageRepository)

              # Service Connection criada no Azure DevOps
              containerRegistry: $(containerRegistry)

              # Dockerfile
              dockerfile: $(dockerfilePath)

              # Contexto do build
              buildContext: $(buildContext)

              # Build args
              arguments: |
                --build-arg NEXT_PUBLIC_APP_URL=$(NEXT_PUBLIC_APP_URL)

              # Tags
              tags: |
                dev
                latest