version: "3.8"

services:
  mongodb:
    image: mongo:7
    container_name: upload-sas-mongodb
    restart: always

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: upload_sas_demo

    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: